name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SPARKYMUSIC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sparkymusic-release.jks"
            echo "SPARKYMUSIC_KEYSTORE_PATH=$RUNNER_TEMP/sparkymusic-release.jks" >> "$GITHUB_ENV"
          else
            echo "No keystore secret found, release build will be unsigned"
          fi

      - name: Build release APK
        env:
          SPARKYMUSIC_KEYSTORE_PASSWORD: ${{ secrets.SPARKYMUSIC_KEYSTORE_PASSWORD }}
          SPARKYMUSIC_KEY_ALIAS: ${{ secrets.SPARKYMUSIC_KEY_ALIAS }}
          SPARKYMUSIC_KEY_PASSWORD: ${{ secrets.SPARKYMUSIC_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparkymusic-release-apk
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: warn