name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SPARKYMUSIC_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          else
            echo "No keystore secret found, release build will fail signing"
          fi

      - name: Build release APK (foss flavor)
        env:
          STORE_PASSWORD: ${{ secrets.SPARKYMUSIC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPARKYMUSIC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPARKYMUSIC_KEY_PASSWORD }}
        run: ./gradlew :app:assembleUniversalFossRelease --stacktrace

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparkymusic-release-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn